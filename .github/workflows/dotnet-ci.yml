name: API CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  build-api:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore AdaptiveTrials.sln

      - name: Build
        run: dotnet build AdaptiveTrials.sln --no-restore

      - name: Test
        run: dotnet test AdaptiveTrials.sln --no-build --verbosity normal
